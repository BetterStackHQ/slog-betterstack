name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

      matrix:
        go-version:
          - "stable"
          - "1.25"
          - "1.24"
          - "1.23"
          - "1.22"
          - "1.21"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -count=1 -v ./...

  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: gofmt
        run: make fmt

      - name: go.mod and go.sum are tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
